[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-narrador-live"
version = "0.1.0"
description = "Narrador de comentarios y saludos para TikTok LIVE"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{name = "SAVecdev"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["narrador*"]

[tool.setuptools.package-data]
narrador = ["voice-models.json"]

[project.gui-scripts]
tiktok-narrador = "narrador.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
