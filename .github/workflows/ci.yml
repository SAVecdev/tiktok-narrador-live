name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux audio and Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libxcb-cursor0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m compileall -q narrador
      - run: python run.py --smoke smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: smoke.png
